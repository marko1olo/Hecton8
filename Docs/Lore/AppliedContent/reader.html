<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HECTON-8 Lore Reader</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0e;
      --panel: #11161c;
      --panel-2: #171d24;
      --line: #27313b;
      --text: #e8edf2;
      --muted: #8e9aa6;
      --soft: #c4ccd4;
      --accent: #76c7d4;
      --warn: #e3b86d;
      --bad: #d98787;
      --good: #91d29b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 14, 0.96);
      padding: 14px 18px;
    }

    h1, h2, h3 {
      line-height: 1.2;
      margin: 0 0 10px;
    }

    h1 {
      font-size: 20px;
      letter-spacing: 0;
    }

    h2 {
      margin-top: 28px;
      font-size: 22px;
    }

    h3 {
      margin-top: 22px;
      font-size: 17px;
    }

    button, select, input {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 4px;
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 8px 10px;
      text-align: left;
    }

    button:hover,
    button.active {
      border-color: var(--accent);
      background: #14222a;
    }

    select, input {
      min-height: 36px;
      padding: 7px 9px;
    }

    input {
      width: 100%;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      align-items: center;
    }

    .shell {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: calc(100vh - 66px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      min-height: 100%;
      padding: 14px;
    }

    main {
      min-width: 0;
      padding: 24px 30px 64px;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .clusters {
      display: grid;
      gap: 6px;
      margin: 12px 0;
    }

    .cluster-button {
      display: grid;
      gap: 2px;
      background: var(--panel-2);
    }

    .cluster-title {
      color: var(--text);
      font-weight: 650;
    }

    .cluster-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .article-list {
      display: grid;
      gap: 6px;
      max-height: calc(100vh - 365px);
      overflow: auto;
      padding-right: 2px;
    }

    .article-button {
      display: grid;
      gap: 4px;
      min-height: 58px;
      background: #0f141a;
    }

    .article-id {
      color: var(--muted);
      font-size: 12px;
    }

    .article-title {
      color: var(--soft);
      font-weight: 600;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      white-space: nowrap;
    }

    .status-source_ready {
      color: var(--good);
    }

    .status-draft_native_pass_pending {
      color: var(--warn);
    }

    .status-missing {
      color: var(--bad);
    }

    .muted {
      color: var(--muted);
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .article-head {
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
      padding-bottom: 18px;
    }

    .article-head h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .article-body {
      max-width: 980px;
      overflow-wrap: anywhere;
    }

    .article-body p {
      margin: 0 0 12px;
    }

    .article-body ul {
      margin: 0 0 14px 20px;
      padding: 0;
    }

    .article-body li {
      margin: 4px 0;
    }

    .article-body pre {
      border: 1px solid var(--line);
      background: #050709;
      overflow: auto;
      padding: 12px;
      border-radius: 4px;
    }

    .path {
      color: var(--muted);
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .empty {
      border: 1px dashed var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 18px;
      border-radius: 4px;
    }

    @media (max-width: 980px) {
      .top-grid {
        grid-template-columns: 1fr;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .article-list {
        max-height: 45vh;
      }

      main {
        padding: 20px 16px 48px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-grid">
      <div>
        <h1>HECTON-8 Lore Reader</h1>
        <div id="globalStatus" class="summary">Loading publication indexes...</div>
      </div>
      <select id="surfaceSelect" aria-label="Surface"></select>
      <select id="localeSelect" aria-label="Locale"></select>
      <select id="statusSelect" aria-label="Localization status">
        <option value="">All statuses</option>
        <option value="source_ready">source_ready</option>
        <option value="draft_native_pass_pending">draft_native_pass_pending</option>
      </select>
    </div>
  </header>

  <div class="shell">
    <aside>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Search title, packet, release set, tags">
        <button id="clearClusterButton" type="button">All articles</button>
      </div>
      <div id="clusterList" class="clusters"></div>
      <div id="listStatus" class="summary"></div>
      <div id="articleList" class="article-list"></div>
    </aside>

    <main>
      <section class="article-head">
        <h1 id="articleTitle">No article selected</h1>
        <div id="articleMeta" class="article-meta"></div>
        <div id="articlePath" class="path"></div>
      </section>
      <article id="articleBody" class="article-body">
        <div class="empty">Select a cluster or article. If Markdown cannot load from disk, open this file through the local HTTP server.</div>
      </article>
    </main>
  </div>

  <script>
    "use strict";

    const surfaceIndexPath = "Publication_Surface_Index.csv";
    const clusterIndexPath = "Publication_Cluster_Index.csv";
    const preferredLocale = "ru_RU";
    const preferredSurface = "external_site";

    const state = {
      surfaceRows: [],
      clusterRows: [],
      filteredRows: [],
      activeRow: null,
      activeCluster: null,
      surface: "",
      locale: "",
      status: "",
      query: ""
    };

    const nodes = {
      globalStatus: document.getElementById("globalStatus"),
      surfaceSelect: document.getElementById("surfaceSelect"),
      localeSelect: document.getElementById("localeSelect"),
      statusSelect: document.getElementById("statusSelect"),
      searchInput: document.getElementById("searchInput"),
      clearClusterButton: document.getElementById("clearClusterButton"),
      clusterList: document.getElementById("clusterList"),
      listStatus: document.getElementById("listStatus"),
      articleList: document.getElementById("articleList"),
      articleTitle: document.getElementById("articleTitle"),
      articleMeta: document.getElementById("articleMeta"),
      articlePath: document.getElementById("articlePath"),
      articleBody: document.getElementById("articleBody")
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function parseCsv(text) {
      if (text.charCodeAt(0) === 0xFEFF) {
        text = text.slice(1);
      }

      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];

        if (inQuotes) {
          if (ch === "\"") {
            if (text[i + 1] === "\"") {
              value += "\"";
              i += 1;
            } else {
              inQuotes = false;
            }
          } else {
            value += ch;
          }
          continue;
        }

        if (ch === "\"") {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(value);
          value = "";
        } else if (ch === "\n") {
          row.push(value.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          value = "";
        } else {
          value += ch;
        }
      }

      if (value.length > 0 || row.length > 0) {
        row.push(value.replace(/\r$/, ""));
        rows.push(row);
      }

      const header = rows.shift() || [];
      return rows
        .filter((item) => item.length === header.length)
        .map((item) => {
          const out = {};
          for (let i = 0; i < header.length; i += 1) {
            out[header[i]] = item[i] || "";
          }
          return out;
        });
    }

    function uniqueSorted(rows, key) {
      const seen = new Set();
      for (let i = 0; i < rows.length; i += 1) {
        const value = rows[i][key];
        if (value) {
          seen.add(value);
        }
      }
      return Array.from(seen).sort();
    }

    function setSelectOptions(select, values, current) {
      select.innerHTML = "";
      for (let i = 0; i < values.length; i += 1) {
        const option = document.createElement("option");
        option.value = values[i];
        option.textContent = values[i];
        select.appendChild(option);
      }
      select.value = values.includes(current) ? current : values[0] || "";
    }

    function normalize(value) {
      return String(value || "").toLocaleLowerCase();
    }

    function rowMatchesQuery(row, query) {
      if (!query) {
        return true;
      }
      const haystack = [
        row.packet_id,
        row.article_id,
        row.title,
        row.release_set_id,
        row.unlock_id,
        row.poi_tags,
        row.biome_tags,
        row.localization_status
      ].join(" ");
      return normalize(haystack).includes(query);
    }

    function getClusterPacketSet(cluster) {
      const set = new Set();
      if (!cluster) {
        return set;
      }
      set.add(cluster.cluster_packet_id);
      addCsvList(set, cluster.prereq_packet_ids);
      addCsvList(set, cluster.next_cluster_packet_ids);
      return set;
    }

    function addCsvList(set, value) {
      if (!value) {
        return;
      }
      const parts = value.split(";");
      for (let i = 0; i < parts.length; i += 1) {
        const item = parts[i].trim();
        if (item) {
          set.add(item);
        }
      }
    }

    function filterRows() {
      const query = normalize(state.query.trim());
      const clusterSet = getClusterPacketSet(state.activeCluster);
      const useCluster = clusterSet.size > 0;
      state.filteredRows = [];

      for (let i = 0; i < state.surfaceRows.length; i += 1) {
        const row = state.surfaceRows[i];
        if (row.surface !== state.surface || row.locale !== state.locale) {
          continue;
        }
        if (state.status && row.localization_status !== state.status) {
          continue;
        }
        if (useCluster && !clusterSet.has(row.packet_id)) {
          continue;
        }
        if (!rowMatchesQuery(row, query)) {
          continue;
        }
        state.filteredRows.push(row);
      }
    }

    function renderClusters() {
      nodes.clusterList.innerHTML = "";
      const rows = state.clusterRows.filter((row) => row.surface === state.surface && row.locale === state.locale);
      rows.sort((a, b) => Number(a.cluster_order || 0) - Number(b.cluster_order || 0));

      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cluster-button";
        if (state.activeCluster && state.activeCluster.cluster_id === row.cluster_id) {
          button.classList.add("active");
        }

        const title = document.createElement("span");
        title.className = "cluster-title";
        title.textContent = row.localized_title || row.cluster_packet_id;

        const meta = document.createElement("span");
        meta.className = "cluster-meta";
        meta.textContent = row.cluster_id + " | " + row.spoiler_tier + " | " + row.route_question;

        button.appendChild(title);
        button.appendChild(meta);
        button.addEventListener("click", () => {
          state.activeCluster = row;
          filterRows();
          renderAll();
          const target = state.surfaceRows.find((item) =>
            item.surface === state.surface &&
            item.locale === state.locale &&
            item.packet_id === row.cluster_packet_id
          );
          if (target) {
            loadArticle(target);
          }
        });
        nodes.clusterList.appendChild(button);
      }
    }

    function renderList() {
      nodes.articleList.innerHTML = "";
      const totalLocaleRows = state.surfaceRows.filter((row) => row.surface === state.surface && row.locale === state.locale).length;
      const clusterText = state.activeCluster ? " | cluster: " + state.activeCluster.cluster_id : "";
      nodes.listStatus.textContent = state.filteredRows.length + " / " + totalLocaleRows + " articles" + clusterText;

      for (let i = 0; i < state.filteredRows.length; i += 1) {
        const row = state.filteredRows[i];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "article-button";
        if (state.activeRow && state.activeRow.packet_id === row.packet_id) {
          button.classList.add("active");
        }

        const id = document.createElement("span");
        id.className = "article-id";
        id.textContent = row.packet_id + " | " + row.release_set_id;

        const title = document.createElement("span");
        title.className = "article-title";
        title.textContent = row.title || row.article_id;

        const meta = document.createElement("span");
        meta.className = "article-meta";
        meta.appendChild(makePill(row.localization_status, "status-" + row.localization_status));
        meta.appendChild(makePill(row.direction || "ltr", ""));

        button.appendChild(id);
        button.appendChild(title);
        button.appendChild(meta);
        button.addEventListener("click", () => loadArticle(row));
        nodes.articleList.appendChild(button);
      }
    }

    function makePill(text, className) {
      const span = document.createElement("span");
      span.className = className ? "pill " + className : "pill";
      span.textContent = text || "missing";
      return span;
    }

    function renderAll() {
      renderClusters();
      renderList();
      nodes.clearClusterButton.classList.toggle("active", !state.activeCluster);
    }

    async function loadArticle(row) {
      state.activeRow = row;
      nodes.articleTitle.textContent = row.title || row.article_id || row.packet_id;
      nodes.articleMeta.innerHTML = "";
      nodes.articleMeta.appendChild(makePill(row.surface, ""));
      nodes.articleMeta.appendChild(makePill(row.locale, ""));
      nodes.articleMeta.appendChild(makePill(row.localization_status, "status-" + row.localization_status));
      nodes.articleMeta.appendChild(makePill(row.release_set_id, ""));
      nodes.articleMeta.appendChild(makePill(row.unlock_id, ""));
      nodes.articlePath.textContent = row.page_path;
      nodes.articleBody.setAttribute("dir", row.direction || "ltr");
      nodes.articleBody.innerHTML = "<div class=\"empty\">Loading Markdown...</div>";
      renderList();

      try {
        const response = await fetch(row.page_path);
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const markdown = await response.text();
        nodes.articleBody.innerHTML = renderMarkdown(markdown);
      } catch (error) {
        nodes.articleBody.innerHTML =
          "<div class=\"empty\">Cannot load article. Run a local HTTP server from this folder and open reader.html through http://127.0.0.1. Error: " +
          escapeHtml(error.message) +
          "</div>";
      }
    }

    function renderMarkdown(markdown) {
      const text = markdown
        .replace(/^---[\s\S]*?---\s*/, "")
        .replace(/<!--[\s\S]*?-->/g, "")
        .trim();
      const lines = text.split(/\r?\n/);
      const html = [];
      let inList = false;
      let inCode = false;
      let code = [];

      function closeList() {
        if (inList) {
          html.push("</ul>");
          inList = false;
        }
      }

      for (let i = 0; i < lines.length; i += 1) {
        const raw = lines[i];
        const line = raw.trimEnd();

        if (line.startsWith("```")) {
          if (inCode) {
            html.push("<pre>" + escapeHtml(code.join("\n")) + "</pre>");
            code = [];
            inCode = false;
          } else {
            closeList();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          code.push(raw);
          continue;
        }

        if (!line.trim()) {
          closeList();
          continue;
        }

        if (line.startsWith("### ")) {
          closeList();
          html.push("<h3>" + escapeHtml(line.slice(4)) + "</h3>");
        } else if (line.startsWith("## ")) {
          closeList();
          html.push("<h2>" + escapeHtml(line.slice(3)) + "</h2>");
        } else if (line.startsWith("# ")) {
          closeList();
          html.push("<h2>" + escapeHtml(line.slice(2)) + "</h2>");
        } else if (line.startsWith("- ")) {
          if (!inList) {
            html.push("<ul>");
            inList = true;
          }
          html.push("<li>" + escapeHtml(line.slice(2)) + "</li>");
        } else {
          closeList();
          html.push("<p>" + escapeHtml(line) + "</p>");
        }
      }

      closeList();
      if (inCode) {
        html.push("<pre>" + escapeHtml(code.join("\n")) + "</pre>");
      }

      return html.length > 0 ? html.join("\n") : "<div class=\"empty\">Article body is empty.</div>";
    }

    function syncSelectors() {
      const surfaces = uniqueSorted(state.surfaceRows, "surface");
      setSelectOptions(nodes.surfaceSelect, surfaces, state.surface || preferredSurface);
      state.surface = nodes.surfaceSelect.value;
      const locales = uniqueSorted(state.surfaceRows.filter((row) => row.surface === state.surface), "locale");
      setSelectOptions(nodes.localeSelect, locales, state.locale || preferredLocale);
      state.locale = nodes.localeSelect.value;
      nodes.statusSelect.value = state.status;
    }

    function resetArticleIfHidden() {
      if (!state.activeRow) {
        return;
      }
      const visible = state.filteredRows.some((row) => row.packet_id === state.activeRow.packet_id);
      if (!visible) {
        state.activeRow = null;
      }
    }

    function refreshAfterControlChange() {
      syncSelectors();
      filterRows();
      resetArticleIfHidden();
      renderAll();
      if (!state.activeRow && state.filteredRows.length > 0) {
        loadArticle(state.filteredRows[0]);
      }
      updateGlobalStatus();
    }

    function updateGlobalStatus() {
      const localeRows = state.surfaceRows.filter((row) => row.surface === state.surface && row.locale === state.locale);
      let ready = 0;
      let draft = 0;
      for (let i = 0; i < localeRows.length; i += 1) {
        if (localeRows[i].localization_status === "source_ready") {
          ready += 1;
        } else if (localeRows[i].localization_status === "draft_native_pass_pending") {
          draft += 1;
        }
      }
      nodes.globalStatus.textContent =
        state.surface + " | " + state.locale + " | source_ready: " + ready + " | draft_native_pass_pending: " + draft;
    }

    async function boot() {
      const surfaceResponse = await fetch(surfaceIndexPath);
      const clusterResponse = await fetch(clusterIndexPath);
      if (!surfaceResponse.ok || !clusterResponse.ok) {
        throw new Error("Publication indexes are not reachable through fetch()");
      }

      state.surfaceRows = parseCsv(await surfaceResponse.text());
      state.clusterRows = parseCsv(await clusterResponse.text());
      state.surface = preferredSurface;
      state.locale = preferredLocale;
      state.status = "";
      state.query = "";

      syncSelectors();
      const firstCluster = state.clusterRows.find((row) =>
        row.surface === state.surface &&
        row.locale === state.locale &&
        row.cluster_id === "start_here"
      );
      state.activeCluster = firstCluster || null;

      filterRows();
      renderAll();
      updateGlobalStatus();

      const startPacket = state.activeCluster ? state.activeCluster.cluster_packet_id : "";
      const startRow = state.surfaceRows.find((row) =>
        row.surface === state.surface &&
        row.locale === state.locale &&
        row.packet_id === startPacket
      ) || state.filteredRows[0];

      if (startRow) {
        loadArticle(startRow);
      }
    }

    nodes.surfaceSelect.addEventListener("change", () => {
      state.surface = nodes.surfaceSelect.value;
      state.activeCluster = null;
      refreshAfterControlChange();
    });

    nodes.localeSelect.addEventListener("change", () => {
      state.locale = nodes.localeSelect.value;
      state.activeCluster = null;
      refreshAfterControlChange();
    });

    nodes.statusSelect.addEventListener("change", () => {
      state.status = nodes.statusSelect.value;
      refreshAfterControlChange();
    });

    nodes.searchInput.addEventListener("input", () => {
      state.query = nodes.searchInput.value;
      filterRows();
      resetArticleIfHidden();
      renderAll();
    });

    nodes.clearClusterButton.addEventListener("click", () => {
      state.activeCluster = null;
      filterRows();
      renderAll();
    });

    boot().catch((error) => {
      nodes.globalStatus.textContent = "Reader failed to boot.";
      nodes.articleBody.innerHTML =
        "<div class=\"empty\">Open this through a local HTTP server. Direct file:// loading blocks CSV/Markdown fetch in most browsers. Error: " +
        escapeHtml(error.message) +
        "</div>";
    });
  </script>
</body>
</html>
