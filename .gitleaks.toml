title = "Hecton8 reviewed generic-api-key allowlists"

[extend]
useDefault = true

# Each allowlist requires both the exact path and a reviewed non-secret text pattern.
# It applies only to generic-api-key; all default rules remain enabled.

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Disabled MMSaveLoad negative-test literal"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/Feel/MMTools/Tools/MMSaveLoad/Editor/Tests/MMSaveLoadManagerMethodJsonEncryptedTests\.cs\.disabled$''']
regexes = ['''InvalidKey456''']

[[rules.allowlists]]
description = "MapMagic AnimationCurve key-count identifier"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/MapMagic/Tools/Extensions/Extensions\.cs$''']
regexes = ['''int numKeys = c1\.keys\.Length''']

[[rules.allowlists]]
description = "Leviathan editor preference identifiers"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Editor/LeviathanProceduralAnimationTunerWindow\.cs$''']
regexes = ['''H8\.LeviathanIK\.(SwimFrequency|SwimAmplitude|FabrikTolerance|SecondaryDamping)''']

[[rules.allowlists]]
description = "Bulkhead editor aggregate-report identifier"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/Construction/Editor/BulkheadContainmentEditor\.cs$''']
regexes = ['''shinobu_220_bulkhead_dod''']

[[rules.allowlists]]
description = "Ecosystem editor aggregate-report identifier"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/Ecosystem/Editor/OOP_Destroy_Scanner\.cs$''']
regexes = ['''shinobu314CarrionDecay''']

[[rules.allowlists]]
description = "Ocean kinematics editor preference identifier"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/Plugins/Crest/Editor/OceanKinematics/OceanKinematicsAupSamplingGizmo\.cs$''']
regexes = ['''Hecton8\.OceanKinematics\.AupGizmo\.Enabled''']

[[rules.allowlists]]
description = "QA watchdog editor session-state identifiers"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/QA/Headless/Editor/Shinobu38QaWatchdogCommanderWindow\.cs$''']
regexes = ['''H8\.SHINOBU79\.(Speed|Avoidance|Telemetry)''']

[[rules.allowlists]]
description = "HUD editor report-section identifier"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/UI/Editor/HUDCanvasInquisition\.cs$''']
regexes = ['''shinobu_270_visor_ar_stencil''']

[[rules.allowlists]]
description = "Jacobian foam editor preference identifiers"
condition = "AND"
regexTarget = "line"
paths = ['''^Assets/_Project/Scripts/VFX/JacobianFoam/Editor/JacobianFoamTunerWindow\.cs$''']
regexes = ['''H8\.JacobianFoam\.(PinchThreshold|DecayRate)''']

[[rules.allowlists]]
description = "Archived fog DTO status prose"
condition = "AND"
regexTarget = "line"
paths = ['''^Docs/Archive/Batch010/Tasks/Status_SHINOBU_120\.md$''']
regexes = ['''VolumetricFogParamsDTO is explicit vault DTO''']

[[rules.allowlists]]
description = "Archived source checksum record"
condition = "AND"
regexTarget = "line"
paths = ['''^Docs/Archive/Batch013/Tasks/Status_1318\.md$''']
regexes = ['''source SHA256''']

[[rules.allowlists]]
description = "Asset-audit material role metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^Docs/AssetAudit/BATCH31_LOCAL_PBR_IMPORT_INTENT_20260605\.json$''']
regexes = ['''"role_key": "normal_tile2x2"''']

[[rules.allowlists]]
description = "Generated water proof metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^Docs/GeneratedAssets/Water/WorldWaterLevelProof_Seed880031_WaterY(-100|0|560)\.json$''']
regexes = ['''"key": "upper_saturated_500m"''']

