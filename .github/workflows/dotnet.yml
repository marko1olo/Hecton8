# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Generate Unity projects
      run: |
        pip install defusedxml
        python -B Tools/generate_unity_slnx_projects.py || true
    - name: Restore dependencies
      run: dotnet restore Hecton8.slnx
    - name: Build
      run: dotnet build Hecton8.slnx --no-restore
    - name: Test
      run: dotnet test Hecton8.slnx --no-build --verbosity normal
